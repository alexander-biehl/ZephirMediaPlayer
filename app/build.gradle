plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'com.google.dagger.hilt.android'
}

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.alexanderbiehl.apps.zephirmediaplayer"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        'room.incremental'   : 'true',
                        'room.schemaLocation': "$projectDir/src/main/res/raw/schemas".toString(),
                ]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        dataBinding true
        viewBinding true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    namespace 'com.alexanderbiehl.apps.zephirmediaplayer'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.10.0'
    implementation 'androidx.navigation:navigation-ui:2.10.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.media3:media3-common:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.room:room-common:2.8.4'
    implementation 'androidx.room:room-guava:2.8.4'
    implementation 'androidx.room:room-paging:2.8.4'
    implementation 'androidx.room:room-runtime:2.8.4'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'

    implementation 'com.google.dagger:hilt-android:2.60.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.60.1'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    androidTestAnnotationProcessor 'com.google.dagger:hilt-compiler:2.60.1'

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:truth:1.7.0'

    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test:core:1.7.0'

    debugImplementation 'androidx.fragment:fragment-testing-manifest:1.9.0'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.9.0'

    debugImplementation 'androidx.test:core:1.7.0'
    debugImplementation 'androidx.test:rules:1.7.0'
    debugImplementation 'androidx.test:runner:1.7.0'

}
